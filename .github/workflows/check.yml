name: Check game and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Syntax and gameplay checks
        run: |
          node --check src/core.js
          node --check src/art.js
          node --check src/app.js
          node tests/core.cjs
          node tests/ui.cjs
          node tests/simulation.cjs
      - name: Build standalone game and Yandex package
        run: |
          python3 build.py
          git diff --exit-code -- index.html
      - uses: actions/upload-artifact@v4
        with:
          name: yandex-games-build
          path: forest-pinball-yandex.zip
